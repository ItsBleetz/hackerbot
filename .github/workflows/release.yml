name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build release binaries
        run: ./build.sh
      - name: Create checksums
        run: sha256sum dist/hackerbot-linux-amd64 dist/hackerbot-windows-amd64.exe > dist/SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/hackerbot-linux-amd64 dist/hackerbot-windows-amd64.exe dist/SHA256SUMS.txt --verify-tag --generate-notes --title "Hackerbot $GITHUB_REF_NAME"
